  <main class="time-off-page">
    <header class="time-off-header">
      <div><h1>Time off</h1><p>Plan your time away and see when teammates are off.</p></div>
      <button id="new-time-off" type="button" class="time-off-primary" disabled>Add time off</button>
    </header>
    <p id="time-off-status" role="status" aria-live="polite"></p>
    <p id="time-off-error" role="alert" hidden></p>
    <div class="time-off-toolbar">
      <div class="time-off-tabs" role="tablist" aria-label="Time off view">
        <button id="view-my" role="tab" aria-selected="true" aria-controls="my-time-off" type="button">My time off</button>
        <button id="view-team" role="tab" aria-selected="false" aria-controls="team-time-off" type="button">Team calendar</button>
      </div>
      <div class="time-off-toolbar-actions">
        <label for="time-off-repository-filter">Time repository</label>
        <select id="time-off-repository-filter"><option value="">All repositories</option></select>
        <button id="refresh-time-off" type="button" class="time-off-secondary">Refresh</button>
      </div>
    </div>
    <section id="my-time-off" role="tabpanel" aria-labelledby="view-my">
      <section class="time-off-section">
        <h2>Upcoming</h2>
        <div id="upcoming-time-off" class="time-off-group-list"></div>
      </section>
      <section class="time-off-section">
        <h2>Past time off</h2>
        <div id="past-time-off" class="time-off-group-list"></div>
      </section>
    </section>
    <section id="team-time-off" role="tabpanel" aria-labelledby="view-team" hidden>
      <div class="time-off-calendar-header">
        <h2>Team calendar</h2>
        <div class="time-off-week-navigation">
          <button id="previous-week" type="button" class="time-off-secondary" aria-label="Previous week">‹</button>
          <strong id="current-week-label"></strong>
          <button id="next-week" type="button" class="time-off-secondary" aria-label="Next week">›</button>
          <button id="this-week" type="button" class="time-off-secondary">This week</button>
        </div>
      </div>
      <p id="team-time-off-status" role="status" aria-live="polite"></p>
      <div class="time-off-calendar-scroll"><table id="team-time-off-table" aria-label="Team time off by day"></table></div>
    </section>
  </main>
  <dialog id="time-off-dialog" aria-labelledby="time-off-dialog-title">
    <form id="time-off-form" novalidate>
      <div class="time-off-dialog-header"><h2 id="time-off-dialog-title">Add time off</h2><button type="button" id="close-time-off" class="time-off-close" aria-label="Close">×</button></div>
      <div class="time-off-form-grid">
        <label>Time repository<select id="edit-repository" required></select></label>
        <label>Type<select id="edit-task" required></select></label>
        <label>From<input id="edit-from" type="date" required></label>
        <label>To<input id="edit-to" type="date" required></label>
        <label>Hours per day<input id="edit-hours" type="number" min="0" max="24" step="0.25" value="8" required></label>
        <label>Start time<input id="edit-start-time" type="time" value="09:00" required></label>
      </div>
      <label class="time-off-inline-check"><input id="include-weekends" type="checkbox"> Include weekends</label>
      <label class="time-off-description">Description (optional)<textarea id="edit-description" rows="2" maxlength="2000" placeholder="Vacation"></textarea></label>
      <div class="time-off-day-heading"><strong>Days included</strong><span id="day-preview-total"></span></div>
      <p id="edit-taken-note" class="time-off-hint" hidden>Days already taken are preserved. This edit affects only the remaining planned days.</p>
      <p id="day-preview-error" class="time-off-hint" role="alert" hidden></p>
      <div id="day-preview" class="time-off-day-list"></div>
      <p id="time-off-form-error" role="alert" hidden></p>
      <footer class="time-off-dialog-actions">
        <button id="cancel-time-off-form" class="time-off-secondary" type="button">Cancel</button>
        <button id="save-time-off" class="time-off-primary" type="submit">Add time off</button>
      </footer>
    </form>
  </dialog>
  <dialog id="time-off-cancel-dialog" aria-labelledby="time-off-cancel-title">
    <h2 id="time-off-cancel-title">Cancel time off?</h2>
    <p id="time-off-cancel-message"></p>
    <p id="time-off-cancel-error" role="alert" hidden></p>
    <div class="time-off-dialog-actions"><button id="keep-time-off" type="button" class="time-off-secondary">Keep</button><button id="confirm-cancel-time-off" type="button" class="time-off-danger">Cancel time off</button></div>
  </dialog>
  <script type="module" src="time-off.js"></script>
</body>
